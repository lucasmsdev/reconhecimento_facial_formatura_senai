version: '3.8'

services:
  face-recognition:
    build: .
    container_name: face-recognition-app
    ports:
      - "8000:8000"
    volumes:
      - ./alunos_cadastrados:/app/alunos_cadastrados
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
