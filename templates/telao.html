<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telão - Formatura Senai Félix Guisard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            overflow: hidden;
            color: #000;
        }

        .page {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }

        .header {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 28px 20px 0;
        }

        .logo {
            max-width: 360px;
            width: 26vw;
            min-width: 200px;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        }

        .header-underline {
            width: 140px;
            height: 4px;
            background: #c41e3a;
            border-radius: 4px;
            margin-top: 18px;
        }

        .telao-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
        }

        .welcome-section {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .student-name {
            font-size: 120px;
            font-weight: 800;
            color: #c41e3a;
            letter-spacing: -1px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            margin: 0;
            text-align: center;
            word-wrap: break-word;
            max-width: 100%;
            padding: 20px;
            animation: slideIn 0.5s ease-out;
        }

        .welcome-text {
            font-size: 42px;
            font-weight: 600;
            color: #000;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 10px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .pulse {
            animation: pulse 0.6s ease-in-out;
        }

        .default-view {
            text-align: center;
            color: #000;
        }

        .default-title {
            font-size: 58px;
            font-weight: 800;
            margin-bottom: 18px;
            letter-spacing: -0.5px;
            color: #000;
        }

        .default-subtitle {
            font-size: 26px;
            font-weight: 400;
            color: #555;
        }

        .history {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #ffffff;
            padding: 18px 20px;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            color: #000;
            font-size: 13px;
            max-width: 300px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 999;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .history-title {
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 2px solid #c41e3a;
            color: #c41e3a;
        }

        .history-item {
            padding: 6px 0;
            color: #333;
        }

        .history-item + .history-item {
            border-top: 1px solid #f0f0f0;
        }

        .history-item .time {
            display: block;
            font-size: 11px;
            color: #999;
        }

        .history-item .name {
            display: block;
            font-weight: 600;
        }

        @media (max-width: 1200px) {
            .student-name {
                font-size: 80px;
            }

            .welcome-text {
                font-size: 32px;
            }

            .default-title {
                font-size: 44px;
            }

            .default-subtitle {
                font-size: 20px;
            }
        }

        @media (max-width: 768px) {
            .logo {
                width: 45vw;
            }

            .student-name {
                font-size: 56px;
            }

            .welcome-text {
                font-size: 24px;
            }

            .default-title {
                font-size: 32px;
            }

            .default-subtitle {
                font-size: 16px;
            }

            .history {
                font-size: 11px;
                max-width: 220px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <img class="logo" src="/static/logo-senai.png" alt="SENAI" onerror="this.style.display='none'">
            <div class="header-underline"></div>
        </div>

        <div class="telao-container">
            <div class="welcome-section">
                <div class="default-view" id="defaultView">
                    <div class="default-title">Formatura Senai Félix Guisard</div>
                    <div class="default-subtitle">Aguardando os formandos...</div>
                </div>

                <div id="welcomeSection" style="display: none;">
                    <div class="welcome-text">Bem-vindo</div>
                    <h1 class="student-name" id="studentName"></h1>
                </div>
            </div>
        </div>
    </div>

    <div class="history" id="history" style="display: none;">
        <div class="history-title">Formandos</div>
        <div id="historyList"></div>
    </div>

    <script>
        const defaultView = document.getElementById('defaultView');
        const welcomeSection = document.getElementById('welcomeSection');
        const studentName = document.getElementById('studentName');
        const history = document.getElementById('history');
        const historyList = document.getElementById('historyList');

        let ws = null;
        let recognizedStudents = [];
        let displayTimeout = null;
        let lastStudentName = null;

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/telao`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('Conectado ao WebSocket');
            };

            ws.onmessage = (event) => {
                console.log('Mensagem recebida:', event.data);

                if (event.data.startsWith('ALUNO:')) {
                    const nome = event.data.substring(6);
                    displayStudent(nome);
                }
            };

            ws.onerror = (error) => {
                console.error('Erro WebSocket:', error);
            };

            ws.onclose = () => {
                console.log('Desconectado do WebSocket');
                setTimeout(connectWebSocket, 3000);
            };
        }

        function displayStudent(nome) {
            if (displayTimeout) {
                clearTimeout(displayTimeout);
            }

            const now = new Date().toLocaleTimeString('pt-BR');

            if (nome !== lastStudentName) {
                recognizedStudents.unshift({ nome, time: now });

                if (recognizedStudents.length > 5) {
                    recognizedStudents.pop();
                }

                lastStudentName = nome;
                updateHistoryDisplay();
            }

            studentName.textContent = nome;
            defaultView.style.display = 'none';
            welcomeSection.style.display = 'block';

            studentName.classList.remove('pulse');
            void studentName.offsetWidth;
            studentName.classList.add('pulse');

            speakName(nome);

            displayTimeout = setTimeout(clearDisplay, 5000);
        }

        function clearDisplay() {
            defaultView.style.display = 'block';
            welcomeSection.style.display = 'none';
            studentName.classList.remove('pulse');

            if (displayTimeout) {
                clearTimeout(displayTimeout);
            }
        }

        function updateHistoryDisplay() {
            if (recognizedStudents.length === 0) {
                history.style.display = 'none';
                return;
            }

            history.style.display = 'block';
            historyList.innerHTML = recognizedStudents
                .map(item => `<div class="history-item"><span class="time">${item.time}</span><span class="name">${item.nome}</span></div>`)
                .join('');
        }

        function speakName(nome) {
            fetch(`/api/speak/${encodeURIComponent(nome)}`)
                .then(response => {
                    if (response.ok) {
                        return response.blob();
                    }
                    throw new Error('Erro ao gerar áudio');
                })
                .then(blob => {
                    const audioUrl = URL.createObjectURL(blob);
                    const audio = new Audio(audioUrl);
                    audio.play().catch(error => {
                        console.error('Erro ao reproduzir áudio:', error);
                    });
                })
                .catch(error => {
                    console.error('Erro ao falar o nome:', error);
                });
        }

        window.addEventListener('load', () => {
            connectWebSocket();
        });

        window.addEventListener('beforeunload', () => {
            if (ws) {
                ws.close();
            }
        });
    </script>
</body>
</html>
